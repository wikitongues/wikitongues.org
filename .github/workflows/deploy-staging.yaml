name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

env:
  REMOTE_DIR: ./public_html/staging.wikitongues.org/

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Compile Stylus
        run: npm run stylus:build

      - name: Install rsync
        run: sudo apt-get install -y rsync

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Trust only the pinned server key. ssh-keyscan trusted whatever answered, on every run, and
      # it failed intermittently (2026-09-11). SSH_HOST_KEY holds the server's public host key as
      # "type base64", one per line; lines copied straight from ssh-keyscan (with the host) work too.
      - name: Add server to known hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          [ -n "$SSH_HOST_KEY" ] || { echo "::error::The SSH_HOST_KEY secret is not set"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_HOST_KEY" | while read -r a b c _; do
            case "$a" in ''|'#'*) continue ;; ssh-*|ecdsa-*|sk-*) type=$a key=$b ;; *) type=$b key=$c ;; esac
            if [ -n "$key" ]; then printf '%s %s %s\n' "$SSH_HOST" "$type" "$key"; fi
          done >> ~/.ssh/known_hosts
          ssh-keygen -F "$SSH_HOST" -f ~/.ssh/known_hosts > /dev/null || { echo "::error::SSH_HOST_KEY holds no usable key"; exit 1; }

      - name: Deploy via rsync
        run: rsync -avz -e "ssh" --filter='merge .rsync-filter' . ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ env.REMOTE_DIR }}

      # The rsync above never deletes, so a file removed from the repo stays on the server and can
      # keep running: the theme loads every file in its includes folders, and WordPress still picks
      # up leftover templates. This pass removes such files, but only inside our own code, because
      # REMOTE_DIR also holds wp-config.php and uploads. It transfers nothing, and keeps the
      # error_log and *.log files the server writes.
      - name: Remove files deleted from the repo (our theme and plugins only)
        run: |
          # A partial checkout would look like a mass deletion, so stop if a core file is missing.
          for f in wp-content/themes/blankslate-child/style.css \
                   wp-content/plugins/download-gateway/download-gateway.php \
                   wp-content/plugins/wt-airtable-sync/wt-airtable-sync.php \
                   wp-content/plugins/wt-gallery/wt-gallery.php \
                   wp-content/plugins/typeahead/typeahead.php; do
            [ -f "$f" ] || { echo "::error::$f is missing from the checkout; not deleting anything"; exit 1; }
          done
          for dir in wp-content/themes/blankslate-child wp-content/plugins/download-gateway \
                     wp-content/plugins/wt-airtable-sync wp-content/plugins/wt-gallery wp-content/plugins/typeahead; do
            rsync -rv --delete --existing --ignore-existing --max-delete=100 -e "ssh" \
              --filter='P error_log' --filter='P *.log' --filter='merge .rsync-filter' \
              "$dir/" "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ env.REMOTE_DIR }}$dir/"
          done

      - name: Health check — confirm homepage returns 200
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://staging.wikitongues.org)
          echo "Homepage status: $status"
          [ "$status" -eq 200 ] || { echo "ERROR: Homepage returned $status after deploy"; exit 1; }

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": ":rocket: Staging deploy complete.",
              "username": "GitHub Actions",
              "icon_emoji": ":rocket:"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": ":x: *Staging deploy failed!*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>",
              "username": "GitHub Actions",
              "icon_emoji": ":rotating_light:"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}