name: Test

on:
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-progress

      - name: Run tests
        run: composer test

  maps-build-tests:
    name: wt-maps build (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wp-content/plugins/wt-maps/build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build dependencies
        run: npm ci

      - name: Run tests
        run: npm test
