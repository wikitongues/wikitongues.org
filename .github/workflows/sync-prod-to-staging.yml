name: Sync to Staging

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sync-staging]

env:
  # Written by backup-prod-db.yml. Outside public_html: anything under the web root can be served over HTTP.
  DUMP_PATH: ~/backups/prod_dump.sql

jobs:
  sync-db:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Trust only the pinned server key. ssh-keyscan trusted whatever answered, on every run, and
      # it failed intermittently (2026-09-11). SSH_HOST_KEY holds the server's public host key as
      # "type base64", one per line; lines copied straight from ssh-keyscan (with the host) work too.
      - name: Add server to known hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          [ -n "$SSH_HOST_KEY" ] || { echo "::error::The SSH_HOST_KEY secret is not set"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_HOST_KEY" | while read -r a b c _; do
            case "$a" in ''|'#'*) continue ;; ssh-*|ecdsa-*|sk-*) type=$a key=$b ;; *) type=$b key=$c ;; esac
            if [ -n "$key" ]; then printf '%s %s %s\n' "$SSH_HOST" "$type" "$key"; fi
          done >> ~/.ssh/known_hosts
          ssh-keygen -F "$SSH_HOST" -f ~/.ssh/known_hosts > /dev/null || { echo "::error::SSH_HOST_KEY holds no usable key"; exit 1; }

      - name: Drop existing views in staging (optional cleanup)
        run: |
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} '
            mysql -u ${{ secrets.STAGING_DB_USER }} -p'"'"'${{ secrets.STAGING_DB_PASS }}'"'"' -N -e "
              SELECT table_name FROM information_schema.views
              WHERE table_schema = '\''${{ secrets.STAGING_DB_NAME }}'\'';" \
            | while read view; do
                echo "Dropping view $view..."
                mysql -u ${{ secrets.STAGING_DB_USER }} -p'"'"'${{ secrets.STAGING_DB_PASS }}'"'"' -e "DROP VIEW IF EXISTS \`${{ secrets.STAGING_DB_NAME }}\`.\`$view\`;"
              done
          '

      - name: Import dump into staging DB
        run: |
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            mysql -u ${{ secrets.STAGING_DB_USER }} -p'${{ secrets.STAGING_DB_PASS }}' ${{ secrets.STAGING_DB_NAME }} < ${{ env.DUMP_PATH }}
          "

      - name: Verify import — confirm published posts exist
        run: |
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            count=\$(mysql -u ${{ secrets.STAGING_DB_USER }} -p'${{ secrets.STAGING_DB_PASS }}' ${{ secrets.STAGING_DB_NAME }} -sN -e \"SELECT COUNT(*) FROM wp_posts WHERE post_status='publish';\") &&
            echo \"Published posts after import: \$count\" &&
            [ \"\$count\" -gt 0 ] || { echo 'ERROR: No published posts found — import likely failed or dump was empty'; exit 1; }
          "

      - name: Sync uploads from prod to staging
        run: |
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            rsync -av --delete ~/public_html/wp-content/uploads/ ~/public_html/staging.wikitongues.org/wp-content/uploads/
          "

      - name: Search-replace https prod URLs
        run: |
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            cd ~/public_html/staging.wikitongues.org &&
            wp search-replace 'https://wikitongues.org' 'https://staging.wikitongues.org' --skip-columns=guid --allow-root
          "

      - name: Search-replace http prod URLs
        run: |
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            cd ~/public_html/staging.wikitongues.org &&
            wp search-replace 'http://wikitongues.org' 'https://staging.wikitongues.org' --skip-columns=guid --allow-root
          "

      - name: Verify search-replace — confirm staging URLs in siteurl and home
        run: |
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            cd ~/public_html/staging.wikitongues.org &&
            siteurl=\$(wp option get siteurl --allow-root) &&
            home=\$(wp option get home --allow-root) &&
            echo \"siteurl: \$siteurl\" &&
            echo \"home:    \$home\" &&
            echo \"\$siteurl\" | grep -q 'staging.wikitongues.org' || { echo 'ERROR: siteurl still points to prod after search-replace'; exit 1; } &&
            echo \"\$home\" | grep -q 'staging.wikitongues.org' || { echo 'ERROR: home still points to prod after search-replace'; exit 1; }
          "

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": ":truck: Staging DB successfully synced from `prod_dump.sql`.",
              "username": "GitHub Actions",
              "icon_emoji": ":truck:"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": ":x: *Staging sync failed!*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>",
              "username": "GitHub Actions",
              "icon_emoji": ":rotating_light:"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
